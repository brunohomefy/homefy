# Compila o Homefy para a Web e publica no GitHub Pages a cada push na main.
# O link fica em: https://<seu-usuario>.github.io/<nome-do-repositorio>/
name: Publicar app web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar pasta web (se ainda não existir)
        run: flutter create . --org com.mycompany --project-name homefy --platforms web

      - name: Dependências
        run: flutter pub get

      - name: Análise do código
        run: flutter analyze --no-fatal-infos

      - name: Testes
        run: flutter test

      - name: Compilar
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
