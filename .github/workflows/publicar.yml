# Em qualquer branch: analisa, testa o app e testa as regras do Firestore.
# Só na main: publica no GitHub Pages (https://brunohomefy.github.io/homefy/).
# Se algo falhar, nada é publicado e a versão anterior continua no ar.
name: Publicar app web

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # só para gravar os prints na branch auditoria-telas
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar pasta web (se ainda não existir)
        run: flutter create . --org com.mycompany --project-name homefy --platforms web

      - name: Dependências
        run: flutter pub get

      # Os erros viram anotações (::error::), visíveis na página do Actions.
      - name: Análise do código
        run: |
          flutter analyze --no-fatal-infos > analise.txt 2>&1 || {
            grep -E "error|warning" analise.txt | head -40 | while read -r l; do echo "::error::$l"; done
            cat analise.txt; exit 1; }

      - name: Testes
        run: |
          flutter test > testes.txt 2>&1 || {
            grep -E "Expected|Actual|Error|error|FAILED|\[E\]" testes.txt | head -40 | while read -r l; do echo "::error::$l"; done
            cat testes.txt; exit 1; }
          tail -1 testes.txt | sed 's/^/::notice::App /'

      - name: Compilar
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      # Versão de demonstração (dados de exemplo, sem Firebase, entra sem senha)
      # em /demo/: serve para ver o visual e para a auditoria das telas.
      - name: Compilar demonstração
        run: |
          flutter build web --release --dart-define=HOMEFY_DEMO=true \
            --base-href "/${{ github.event.repository.name }}/demo/" --output build/demo
          cp paginas/* build/demo/  # Política de Privacidade e Termos de Uso (também na demo)
          cp -r build/demo build/web/demo
          cp paginas/* build/web/

      # Prints automáticos das telas (versão de demonstração), gravados na branch
      # auditoria-telas. Não bloqueia a publicação se falhar.
      - name: Auditoria visual (prints)
        continue-on-error: true
        run: |
          mkdir -p srv/homefy && cp -r build/demo srv/homefy/demo
          (cd srv && python3 -m http.server 8000 >/dev/null 2>&1 &)
          cd tools/auditoria && npm install --no-audit --no-fund && npx playwright install --with-deps chromium
          node telas.mjs http://localhost:8000/homefy/demo/ ../../prints
          cd ../..
          git config user.name "auditoria-bot"; git config user.email "actions@github.com"
          git checkout --orphan auditoria-telas
          git rm -rfq . ; git clean -fdxq -e prints -e build
          echo "Prints de ${GITHUB_SHA::7} (${GITHUB_REF_NAME})" > prints/ORIGEM.txt
          git add prints && git commit -qm "Prints ${GITHUB_SHA::7}" && git push -fq origin auditoria-telas

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  regras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Testar regras do Firestore no emulador
        working-directory: tests_regras
        run: |
          npm install --no-audit --no-fund
          npm test > regras.txt 2>&1 || {
            grep -E "not ok|Error|error|failed|FAIL" regras.txt | head -40 | while read -r l; do echo "::error::$l"; done
            cat regras.txt; exit 1; }
          grep -E "^# (tests|pass|fail)" regras.txt | while read -r l; do echo "::notice::Regras $l"; done
          cat regras.txt

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, regras]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
